name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chess_insights
          POSTGRES_USER: chess_user
          POSTGRES_PASSWORD: chess_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chess_user -d chess_insights"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://chess_user:chess_password@localhost:5433/chess_insights
      # Deliberately unset: the ordinary suite must pass with no engine
      # installed, using the fake engine instead.
      STOCKFISH_PATH: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Proves the schema builds from nothing, which `alembic check` alone
      # cannot catch.
      - name: Build the schema from an empty database
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Check for undeclared model changes
        run: alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  engine:
    name: Engine integration (real Stockfish)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chess_insights
          POSTGRES_USER: chess_user
          POSTGRES_PASSWORD: chess_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chess_user -d chess_insights"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://chess_user:chess_password@localhost:5433/chess_insights

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the schema
        run: alembic upgrade head

      - name: Run only the engine integration tests
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: pytest -m stockfish_integration -q
